<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia QR · Colegio María Montessori</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <!-- Lector de QR por cámara (usado en la vista "Escanear asistencia") -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menú"></button>
        <div id="topbar-title"></div>
        <div class="spacer"></div>
        <button class="icon-btn" id="notif-btn" aria-label="Notificaciones"></button>
        <div class="user-chip" id="user-chip"></div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="toast-host" id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
